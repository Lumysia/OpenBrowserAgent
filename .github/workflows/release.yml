name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Type check
        run: npm run compile

      - name: Unit and protocol tests
        run: npm test

      - name: Package
        run: |
          npx wxt zip -b chrome
          npx wxt zip -b firefox
          npx wxt zip -b safari

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $prerelease \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            .output/*.zip

      # Submits the Chrome package for review with the Chrome Web Store API v2.
      # Skipped for pre-releases, and until the store is configured: repository
      # variables CHROME_EXTENSION_ID, CHROME_PUBLISHER_ID and
      # CHROME_SERVICE_ACCOUNT_EMAIL, and the secret CHROME_SERVICE_ACCOUNT_KEY
      # (the service account's private key).
      - name: Submit to the Chrome Web Store
        if: ${{ !contains(github.ref_name, '-') && vars.CHROME_EXTENSION_ID != '' }}
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ vars.CHROME_SERVICE_ACCOUNT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_KEY }}
        run: npx wxt submit --chrome-zip .output/*-chrome.zip
